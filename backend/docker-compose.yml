name: mpaz-panol

# Cada microservicio tiene su propio Dockerfile y su propio contenedor.
# Solo el api-gateway publica un puerto hacia afuera (8080).
#
#   docker compose up -d --build                  -> usa la base de datos de Supabase (.env)
#   docker compose --profile local up -d --build  -> ademas levanta un Postgres local de pruebas

x-service-env: &service-env
  DB_URL: ${DB_URL}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}

services:
  # Base de datos Postgres solo para desarrollo offline (perfil "local").
  postgres-local:
    image: postgres:17-alpine
    profiles: ["local"]
    container_name: panol-postgres-local
    environment:
      POSTGRES_DB: panol
      POSTGRES_USER: panol
      POSTGRES_PASSWORD: panol
    ports:
      - "5434:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panol -d panol"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./auth-service
    container_name: panol-auth-service
    restart: unless-stopped
    environment: *service-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  inventory-service:
    build: ./inventory-service
    container_name: panol-inventory-service
    restart: unless-stopped
    environment:
      <<: *service-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  audit-service:
    build: ./audit-service
    container_name: panol-audit-service
    restart: unless-stopped
    environment:
      <<: *service-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  request-service:
    build: ./request-service
    container_name: panol-request-service
    restart: unless-stopped
    environment:
      <<: *service-env
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      AUDIT_SERVICE_URL: http://audit-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  notification-service:
    build: ./notification-service
    container_name: panol-notification-service
    restart: unless-stopped
    environment:
      <<: *service-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Unico servicio expuesto hacia afuera: la app Android se conecta aqui (puerto 8080).
  api-gateway:
    build: ./api-gateway
    container_name: panol-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      REQUEST_SERVICE_URL: http://request-service:8083
      AUDIT_SERVICE_URL: http://audit-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    depends_on:
      auth-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      request-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_local_data:
